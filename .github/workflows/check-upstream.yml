name: Check Upstream Releases

on:
  schedule:
    - cron: "0 */6 * * *"  # Every 6 hours
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: write

    steps:
    - name: Checkout repo
      uses: actions/checkout@v4

    - name: Check for new upstream releases
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        set -euo pipefail

        # Define upstream repos and their package names
        declare -A UPSTREAMS=(
          ["gamescope"]="ValveSoftware/gamescope"
          ["mangohud"]="flightlessmango/MangoHud"
          ["gamemode"]="FeralInteractive/gamemode"
          ["lutris"]="lutris/lutris"
          ["proton-ge"]="GloriousEggroll/proton-ge-custom"
          ["sunshine"]="LizardByte/Sunshine"
        )

        FAILED_DISPATCHES=()

        for pkg in "${!UPSTREAMS[@]}"; do
          repo="${UPSTREAMS[$pkg]}"
          echo "Checking $pkg ($repo)..."

          # Get latest upstream release tag
          UPSTREAM_TAG=$(gh api "repos/$repo/releases/latest" --jq '.tag_name // empty' 2>/dev/null || true)
          if [[ "$UPSTREAM_TAG" == "{"* ]] || [[ "$UPSTREAM_TAG" == "null" ]]; then
            UPSTREAM_TAG=""
          fi
          if [[ -z "$UPSTREAM_TAG" ]]; then
            # Fall back to latest tag if no releases
            UPSTREAM_TAG=$(gh api "repos/$repo/tags" --jq '.[0].name // empty' 2>/dev/null || true)
            if [[ "$UPSTREAM_TAG" == "{"* ]] || [[ "$UPSTREAM_TAG" == "null" ]]; then
              UPSTREAM_TAG=""
            fi
          fi

          if [[ -z "$UPSTREAM_TAG" ]]; then
            echo "  Could not determine upstream tag for $pkg, skipping"
            continue
          fi

          echo "  Latest upstream: $UPSTREAM_TAG"

          # Check if we already have a release for this version.
          # Normalize the version the same way common.sh generate_changelog does
          # (strip leading non-digits, '-' -> '.'), then use the tag format
          # build-package.yml actually creates: the deb version is
          # <normalized>-1~debiangaming and '~' becomes '-' in the git tag.
          NORMALIZED=$(echo "$UPSTREAM_TAG" | sed 's/^[^0-9]*//' | tr '-' '.')
          RELEASE_TAG="${pkg}-${NORMALIZED}-1-debiangaming"
          EXISTING=$(gh release view "$RELEASE_TAG" --json tagName --jq '.tagName' 2>/dev/null || echo "")

          if [[ -n "$EXISTING" ]]; then
            echo "  Already built $EXISTING, skipping"
            continue
          fi

          echo "  New release detected! Triggering build for $pkg @ $UPSTREAM_TAG"
          if ! gh workflow run "build-${pkg}.yml" -f version="$UPSTREAM_TAG"; then
            echo "  Failed to trigger build for $pkg"
            FAILED_DISPATCHES+=("$pkg")
          fi
        done

        if [[ ${#FAILED_DISPATCHES[@]} -gt 0 ]]; then
          echo "Failed to dispatch builds for: ${FAILED_DISPATCHES[*]}"
          exit 1
        fi
